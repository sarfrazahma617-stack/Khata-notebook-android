name: Build Khata Notebook APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KhataNotebook_Mobile_Cloud_Build.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip KhataNotebook_Mobile_Cloud_Build.zip -d project

          - name: Set up Gradle
            uses: gradle/actions/setup-gradle@v4
            with:
              gradle-version: '8.7'

          - name: Build APK
            working-directory: project
            run: gradle assembleDebug

          - name: Upload APK
            uses: actions/upload-artifact@v4
            with:
              name: Khata-Notebook-APK
              path: project/**/build/outputs/apk/debug/*.apk

